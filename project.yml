name: AIServerClient
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  AIServerClient:
    type: application
    platform: iOS
    sources: [AIServerClient]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.msadream.AIServerClient
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Server
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
